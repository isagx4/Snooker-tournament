<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Snooker Tournament Engine</title>

<style>
body{
    font-family:Arial;
    background:#f3f3f3;
    margin:0;
    padding:10px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:12px;
}

h1,h2{text-align:center}

.section{
    margin-top:15px;
    padding-top:10px;
    border-top:1px solid #ddd;
}

input,select{
    width:100%;
    padding:10px;
    margin:5px 0;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    width:100%;
    padding:12px;
    background:#167a3f;
    color:white;
    border:none;
    border-radius:10px;
    margin-top:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th,td{
    border:1px solid #ccc;
    padding:6px;
    text-align:center;
}

th{background:#111;color:#fff}

.winner{
    font-size:18px;
    text-align:center;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>🎱 Tournament Engine</h1>

<!-- MATCH INPUT -->
<div class="section">
<h2>➕ Add Match</h2>

<select id="p1"></select>
<select id="p2"></select>

<input id="s1" type="number" placeholder="Player 1 Score">
<input id="s2" type="number" placeholder="Player 2 Score">

<button onclick="addMatch()">Add Match</button>
</div>

<!-- GROUP TABLE -->
<div class="section">
<h2>📊 Group Table</h2>

<table>
<thead>
<tr>
<th>Pos</th>
<th>Player</th>
<th>Scored</th>
<th>Conceded</th>
<th>Diff</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

<!-- KO -->
<div class="section">
<h2>🏆 Knockout</h2>

<div id="ko"></div>
</div>

<div class="section">
<h2>🥇 Winner</h2>
<div class="winner" id="winner">No winner yet</div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getDatabase,
  ref,
  set,
  onValue
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "cs-doinks-tournament.firebaseapp.com",
  databaseURL: "https://cs-doinks-tournament-default-rtdb.firebaseio.com",
  projectId: "cs-doinks-tournament"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let state = {
    players:[
        {name:"Afwan",s:0,c:0},
        {name:"Rhuel",s:0,c:0},
        {name:"Shahel",s:0,c:0},
        {name:"TK",s:0,c:0}
    ],
    matches:[]
};

const table=document.getElementById("table");
const p1=document.getElementById("p1");
const p2=document.getElementById("p2");

function updateDropdowns(){

    p1.innerHTML="";
    p2.innerHTML="";

    state.players.forEach(p=>{
        p1.innerHTML+=`<option>${p.name}</option>`;
        p2.innerHTML+=`<option>${p.name}</option>`;
    });
}

function recalc(){

    state.players.forEach(p=>{
        p.s=0;
        p.c=0;
    });

    state.matches.forEach(m=>{

        let A=state.players.find(p=>p.name==m.a);
        let B=state.players.find(p=>p.name==m.b);

        A.s+=m.sa;
        A.c+=m.sb;

        B.s+=m.sb;
        B.c+=m.sa;
    });

    state.players.sort((a,b)=>(b.s-b.c)-(a.s-a.c));

    renderTable();
    renderKO();
}

function renderTable(){

    table.innerHTML="";

    state.players.forEach((p,i)=>{

        table.innerHTML+=`
        <tr>
        <td>${i+1}</td>
        <td>${p.name}</td>
        <td>${p.s}</td>
        <td>${p.c}</td>
        <td>${p.s-p.c}</td>
        </tr>`;
    });
}

window.addMatch=function(){

    let match={
        a:p1.value,
        b:p2.value,
        sa:+s1.value,
        sb:+s2.value
    };

    state.matches.push(match);

    recalc();
    save();
}

function renderKO(){

    if(state.players.length<4) return;

    let top=[...state.players]
        .sort((a,b)=>(b.s-b.c)-(a.s-a.c));

    let ko=[
        `${top[0].name} vs ${top[3].name}`,
        `${top[1].name} vs ${top[2].name}`
    ];

    document.getElementById("ko").innerHTML=
        ko.map(k=>`<p>${k}</p>`).join("");
}

function save(){
    set(ref(db,"tournament"),state);
}

onValue(ref(db,"tournament"),snap=>{

    if(snap.val()){
        state=snap.val();
    }

    updateDropdowns();
    recalc();
});

updateDropdowns();

</script>

</body>
</html>

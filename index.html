<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Snooker Tournament</title>

<style>
body{
    font-family:Arial;
    background:#f3f3f3;
    margin:0;
    padding:10px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:12px;
}

h1,h2{text-align:center}

.section{
    margin-top:15px;
    padding-top:10px;
    border-top:1px solid #ddd;
}

input,select{
    width:100%;
    padding:10px;
    margin:5px 0;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    width:100%;
    padding:12px;
    background:#167a3f;
    color:white;
    border:none;
    border-radius:10px;
    margin-top:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th,td{
    border:1px solid #ccc;
    padding:6px;
    text-align:center;
}

th{background:#111;color:#fff}

</style>
</head>

<body>

<div class="container">

<h1>🎱 Tournament System</h1>

<!-- MATCH INPUT -->
<div class="section">
<h2>➕ Add Match</h2>

<select id="p1"></select>
<select id="p2"></select>

<input id="s1" type="number" placeholder="Score P1">
<input id="s2" type="number" placeholder="Score P2">

<button onclick="addMatch()">Add Match</button>
</div>

<!-- TABLE -->
<div class="section">
<h2>📊 Group Table</h2>

<table>
<thead>
<tr>
<th>#</th>
<th>Player</th>
<th>G</th>
<th>F</th>
<th>A</th>
<th>SD</th>
<th>P</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

<!-- KO -->
<div class="section">
<h2>🏆 Knockout Stage</h2>
<div id="ko"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getDatabase,
  ref,
  set,
  onValue
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBVTtrIgnr1oYsLz7fpZzHhjlfDSK09WqI",
  authDomain: "cs-doinks-tournament.firebaseapp.com",
  databaseURL: "https://cs-doinks-tournament-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "cs-doinks-tournament",
  storageBucket: "cs-doinks-tournament.firebasestorage.app",
  messagingSenderId: "856961261990",
  appId: "1:856961261990:web:b781ef44909912ff472f67",
  measurementId: "G-DRGVPY9E6C"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let state = {
    players:[
        {name:"A_Zina"},
        {name:"Rolo"},
        {name:"DB"},
        {name:"TK"}
    ],
    matches:[]
};

const table=document.getElementById("table");
const ko=document.getElementById("ko");
const p1=document.getElementById("p1");
const p2=document.getElementById("p2");

let history=document.getElementById("history");

if(!history){
    const section=document.createElement("div");
    section.className="section";

    section.innerHTML=`
    <h2>📋 Match History</h2>
    <div id="history"></div>

    <button onclick="clearMatches()">
    Clear Matches
    </button>

    <button onclick="resetTournament()" style="background:#c62828;">
    Reset Tournament
    </button>
    `;

    document.querySelector(".container").appendChild(section);

    history=document.getElementById("history");
}

function resetStats(){
    state.players.forEach(p=>{
        p.G=0;
        p.F=0;
        p.A=0;
        p.P=0;
    });
}

function recalc(){

    resetStats();

    state.matches.forEach(m=>{

        let A=state.players.find(p=>p.name===m.a);
        let B=state.players.find(p=>p.name===m.b);

        if(!A || !B) return;

        A.G++;
        B.G++;

        A.F+=m.sa;
        A.A+=m.sb;

        B.F+=m.sb;
        B.A+=m.sa;

        if(m.sa>m.sb){
            A.P++;
        }else if(m.sb>m.sa){
            B.P++;
        }
    });

    state.players.sort((a,b)=>
        (b.P-a.P) ||
        ((b.F-b.A)-(a.F-a.A))
    );

    renderTable();
    renderKO();
    renderHistory();
}

function renderTable(){

    table.innerHTML="";

    state.players.forEach((p,i)=>{

        table.innerHTML+=`
        <tr>
        <td>${i+1}</td>
        <td>${p.name}</td>
        <td>${p.G}</td>
        <td>${p.F}</td>
        <td>${p.A}</td>
        <td>${p.F-p.A}</td>
        <td>${p.P}</td>
        </tr>
        `;
    });
}

function renderKO(){

    if(state.players.length<4) return;

    let top=[...state.players];

    top.sort((a,b)=>
        (b.P-a.P) ||
        ((b.F-b.A)-(a.F-a.A))
    );

    ko.innerHTML=`
    <p><strong>KO1:</strong> ${top[0].name} vs ${top[3].name}</p>
    <p><strong>KO2:</strong> ${top[1].name} vs ${top[2].name}</p>
    `;
}

function renderHistory(){

    history.innerHTML="";

    if(state.matches.length===0){
        history.innerHTML="<p>No matches played yet.</p>";
        return;
    }

    state.matches.forEach((m,index)=>{

        history.innerHTML+=`
        <p>
        ${index+1}. ${m.a} ${m.sa} - ${m.sb} ${m.b}
        </p>
        `;
    });
}

function updateDropdowns(){

    p1.innerHTML="";
    p2.innerHTML="";

    state.players.forEach(p=>{

        p1.innerHTML+=`
        <option>${p.name}</option>
        `;

        p2.innerHTML+=`
        <option>${p.name}</option>
        `;
    });
}

window.addMatch=function(){

    if(p1.value===p2.value){
        alert("Players must be different");
        return;
    }

    state.matches.push({
        a:p1.value,
        b:p2.value,
        sa:+s1.value,
        sb:+s2.value
    });

    s1.value="";
    s2.value="";

    recalc();
    save();
}

window.clearMatches=function(){

    if(!confirm("Clear all matches?")) return;

    state.matches=[];

    recalc();
    save();
}

window.resetTournament=function(){

    if(!confirm("Reset entire tournament?")) return;

    state={
        players:[
            {name:"AZ"},
            {name:"Rolo"},
            {name:"DB"},
            {name:"TK"}
        ],
        matches:[]
    };

    updateDropdowns();
    recalc();
    save();
}

function save(){
    set(ref(db,"tournament"),state);
}

onValue(ref(db,"tournament"),snap=>{

    if(snap.val()){
        state=snap.val();
    }

    updateDropdowns();
    recalc();
});

updateDropdowns();
recalc();

</script>

</div>

</body>
</html>

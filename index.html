<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Snooker Tournament</title>

<style>
body{
    font-family:Arial;
    background:#f3f3f3;
    margin:0;
    padding:10px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:12px;
}

h1,h2{text-align:center}

.section{
    margin-top:15px;
    padding-top:10px;
    border-top:1px solid #ddd;
}

input,select{
    width:100%;
    padding:10px;
    margin:5px 0;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    width:100%;
    padding:12px;
    background:#167a3f;
    color:white;
    border:none;
    border-radius:10px;
    margin-top:10px;
}

.small-btn{
    width:auto;
    padding:6px 10px;
    font-size:12px;
    background:#b00020;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th,td{
    border:1px solid #ccc;
    padding:6px;
    text-align:center;
}

th{background:#111;color:#fff}

.footer{
    margin-top:30px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎱 Tournament System</h1>

<!-- MATCH INPUT -->
<div class="section">
<h2>➕ Add Match</h2>

<select id="p1"></select>
<select id="p2"></select>

<input id="s1" type="number" placeholder="Score P1">
<input id="s2" type="number" placeholder="Score P2">

<button onclick="addMatch()">Add Match</button>
</div>

<!-- TABLE -->
<div class="section">
<h2>📊 Group Table</h2>

<table>
<thead>
<tr>
<th>#</th>
<th>Player</th>
<th>G</th>
<th>F</th>
<th>A</th>
<th>SD</th>
<th>P</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

<!-- HISTORY -->
<div class="section">
<h2>📜 Match History</h2>
<div id="history"></div>
</div>

<!-- RESET -->
<div class="section footer">
<button class="small-btn" onclick="resetAll()">
Reset Tournament
</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getDatabase,
  ref,
  set,
  onValue
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "cs-doinks-tournament.firebaseapp.com",
  databaseURL: "https://cs-doinks-tournament-default-rtdb.firebaseio.com",
  projectId: "cs-doinks-tournament"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let state = {
    players:[
        {name:"AZ"},
        {name:"Rolo"},
        {name:"DB"},
        {name:"TK"}
    ],
    matches:[]
};

const table=document.getElementById("table");
const history=document.getElementById("history");

const p1=document.getElementById("p1");
const p2=document.getElementById("p2");

function initPlayers(){
    state.players.forEach(p=>{
        p.G=0;
        p.F=0;
        p.A=0;
        p.P=0;
    });
}

function recalc(){

    initPlayers();

    state.matches.forEach(m=>{

        let A=state.players.find(p=>p.name===m.a);
        let B=state.players.find(p=>p.name===m.b);

        A.G++; B.G++;

        A.F+=m.sa;
        A.A+=m.sb;

        B.F+=m.sb;
        B.A+=m.sa;

        if(m.sa>m.sb) A.P++;
        else if(m.sb>m.sa) B.P++;
    });

    state.players.sort((a,b)=>
        (b.P - a.P) ||
        ((b.F-b.A)-(a.F-a.A))
    );

    render();
    renderHistory();
}

function render(){

    table.innerHTML="";

    state.players.forEach((p,i)=>{

        let sd = (p.F - p.A);

        table.innerHTML+=`
        <tr>
        <td>${i+1}</td>
        <td>${p.name}</td>
        <td>${p.G}</td>
        <td>${p.F}</td>
        <td>${p.A}</td>
        <td>${sd}</td>
        <td>${p.P}</td>
        </tr>`;
    });
}

function renderHistory(){

    history.innerHTML="";

    state.matches.forEach(m=>{

        history.innerHTML+=`
        <p>
        ${m.a} ${m.sa} - ${m.sb} ${m.b}
        </p>`;
    });
}

function updateDropdowns(){

    p1.innerHTML="";
    p2.innerHTML="";

    state.players.forEach(p=>{
        p1.innerHTML+=`<option>${p.name}</option>`;
        p2.innerHTML+=`<option>${p.name}</option>`;
    });
}

window.addMatch=function(){

    let match={
        a:p1.value,
        b:p2.value,
        sa:+s1.value,
        sb:+s2.value
    };

    state.matches.push(match);

    recalc();
    save();
}

function save(){
    set(ref(db,"tournament"),state);
}

onValue(ref(db,"tournament"),snap=>{

    if(snap.val()){
        state=snap.val();
    }

    updateDropdowns();
    recalc();
});

window.resetAll=function(){

    if(!confirm("Are you sure you want to reset everything?")) return;

    state.matches=[];

    state.players=[
        {name:"AZ"},
        {name:"Rolo"},
        {name:"DB"},
        {name:"TK"}
    ];

    save();
    recalc();
}

updateDropdowns();
recalc();

</script>

</body>
</html>
